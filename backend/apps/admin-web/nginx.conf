server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Совпадает с лимитом multer / FilesService docs/-policy (200 МБ).
  # 50M было мало — POST /api/projects/:id/documents/upload падал на крупных видео.
  client_max_body_size 200M;

  # API/healthz/socket.io проксируются на api-контейнер (docker-сетевой alias `api`),
  # чтобы SPA звала relative `/api/...` без CORS-проблем при доступе по любому хосту.
  location = /healthz {
    proxy_pass http://api:3000/healthz;
  }

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 5 минут — uploads до 200 МБ через мобилку (медленный мобильный канал)
    # успевают долить файл; для коротких GET таймаут не активируется.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Отключаем буферизацию body на nginx — multer на api сам стримит файл,
    # не имеет смысла копить 200 МБ в /tmp nginx-а.
    proxy_request_buffering off;
  }

  location /socket.io/ {
    proxy_pass http://api:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /legal {
    proxy_pass http://api:3000/legal;
    proxy_set_header Host $host;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
